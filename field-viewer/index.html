<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>STOCHOS field viewer (prototype)</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --line: #2a2a2a;
    --amber: #f5a623;
    --text: #e8e6e1;
    --muted: #9a968e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  #scene.dragging { cursor: grabbing; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 18px 24px;
    display: flex; align-items: baseline; gap: 14px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,10,10,.85), rgba(10,10,10,0));
  }
  .eyebrow {
    color: var(--amber);
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    white-space: nowrap;
  }
  h1 { font-size: 16px; font-weight: 500; }
  h1 span { color: var(--muted); font-weight: 400; }

  #legend {
    position: fixed; right: 24px; top: 50%; transform: translateY(-50%);
    display: flex; gap: 10px; align-items: stretch;
    pointer-events: none;
  }
  #ramp {
    width: 14px; height: 240px;
    border: 1px solid var(--line); border-radius: 3px;
  }
  #legendLabels {
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #legendTitle {
    position: absolute; right: 0; top: -34px;
    font-size: 11px; color: var(--text); letter-spacing: .04em;
    text-align: right; width: 160px;
  }

  #readout {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 2px solid var(--amber);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    display: none;
    transform: translate(14px, -50%);
    white-space: nowrap;
  }
  #readout b { color: var(--amber); font-weight: 600; }

  footer {
    position: fixed; left: 24px; bottom: 18px; right: 24px;
    display: flex; justify-content: space-between; gap: 16px;
    font-size: 11.5px; color: var(--muted);
    pointer-events: none;
    flex-wrap: wrap;
  }
  footer .stat b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header>
  <div class="eyebrow">Prototype</div>
  <h1 id="title">Loading mesh <span></span></h1>
</header>

<div id="legend">
  <div id="legendTitle"></div>
  <canvas id="ramp" width="14" height="240"></canvas>
  <div id="legendLabels"><span id="lblMax"></span><span id="lblMid"></span><span id="lblMin"></span></div>
</div>

<div id="readout"></div>

<footer>
  <div class="stat" id="stats"></div>
  <div>drag to rotate, wheel to zoom, hover for the node value</div>
</footer>

<script type="module">
import * as THREE from './three.module.min.js';

const INFERNO = [
  [0.00, 0, 0, 4], [0.13, 31, 12, 72], [0.25, 85, 15, 109], [0.38, 136, 34, 106],
  [0.50, 186, 54, 85], [0.63, 227, 89, 51], [0.75, 249, 140, 10],
  [0.88, 249, 201, 50], [1.00, 252, 255, 164],
];
function colormap(t) {
  t = Math.min(1, Math.max(0, t));
  for (let i = 1; i < INFERNO.length; i++) {
    if (t <= INFERNO[i][0]) {
      const [t0, r0, g0, b0] = INFERNO[i - 1];
      const [t1, r1, g1, b1] = INFERNO[i];
      const f = (t - t0) / (t1 - t0);
      return [(r0 + f * (r1 - r0)) / 255, (g0 + f * (g1 - g0)) / 255, (b0 + f * (b1 - b0)) / 255];
    }
  }
  return [1, 1, 1];
}

const meta = await (await fetch('meta.json')).json();
const buf = await (await fetch('mesh.bin')).arrayBuffer();
const positions = new Float32Array(buf, meta.offsets.positions, meta.nPoints * 3);
const indices = new Uint32Array(buf, meta.offsets.indices, meta.nTriangles * 3);
const scalars = new Float32Array(buf, meta.offsets.scalars, meta.nPoints);

const { scalarMin: sMin, scalarMax: sMax } = meta;
const colors = new Float32Array(meta.nPoints * 3);
for (let i = 0; i < meta.nPoints; i++) {
  const [r, g, b] = colormap((scalars[i] - sMin) / (sMax - sMin));
  colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
}

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geo.setIndex(new THREE.BufferAttribute(indices, 1));
geo.computeVertexNormals();

const mat = new THREE.MeshStandardMaterial({
  vertexColors: true, metalness: 0.05, roughness: 0.75, side: THREE.DoubleSide,
});
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(1, 1.4, 0.8);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-1, -0.6, -1);
scene.add(fill);

const R = meta.boundsRadius;
const camera = new THREE.PerspectiveCamera(40, 1, R / 100, R * 20);

// minimal orbit control: spherical coordinates around the origin
let theta = 0.9, phi = 1.05, dist = R * 3.2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let autoRotate = !reduceMotion;
function applyCamera() {
  camera.position.set(
    dist * Math.sin(phi) * Math.sin(theta),
    dist * Math.cos(phi),
    dist * Math.sin(phi) * Math.cos(theta),
  );
  camera.lookAt(0, 0, 0);
}
let dragging = false, px = 0, py = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; autoRotate = false; px = e.clientX; py = e.clientY;
  canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', e => {
  dragging = false; canvas.classList.remove('dragging'); canvas.releasePointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (dragging) {
    theta -= (e.clientX - px) * 0.006;
    phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - (e.clientY - py) * 0.006));
    px = e.clientX; py = e.clientY;
  }
  hover(e);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.min(R * 12, Math.max(R * 1.2, dist * (e.deltaY > 0 ? 1.1 : 0.9)));
}, { passive: false });

// hover readout via raycasting: nearest vertex of the hit face
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const readout = document.getElementById('readout');
function hover(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(mesh)[0];
  if (!hit) { readout.style.display = 'none'; return; }
  const face = hit.face;
  let best = face.a, bestD = Infinity;
  for (const vi of [face.a, face.b, face.c]) {
    const d = hit.point.distanceToSquared(new THREE.Vector3().fromBufferAttribute(geo.attributes.position, vi));
    if (d < bestD) { bestD = d; best = vi; }
  }
  readout.innerHTML = `${meta.scalarName}: <b>${scalars[best].toFixed(3)}</b>`;
  readout.style.left = e.clientX + 'px';
  readout.style.top = e.clientY + 'px';
  readout.style.display = 'block';
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  if (autoRotate) theta += 0.0025;
  applyCamera();
  renderer.render(scene, camera);
});

// legend
const ramp = document.getElementById('ramp').getContext('2d');
for (let y = 0; y < 240; y++) {
  const [r, g, b] = colormap(1 - y / 239);
  ramp.fillStyle = `rgb(${r * 255},${g * 255},${b * 255})`;
  ramp.fillRect(0, y, 14, 1);
}
document.getElementById('legendTitle').textContent = meta.scalarName;
document.getElementById('lblMax').textContent = sMax.toFixed(2);
document.getElementById('lblMid').textContent = ((sMin + sMax) / 2).toFixed(2);
document.getElementById('lblMin').textContent = sMin.toFixed(2);

document.getElementById('title').innerHTML =
  `STOCHOS example mesh <span>Design0006, surface.vtp</span>`;
document.getElementById('stats').innerHTML =
  `<b>${meta.nPoints.toLocaleString('en')}</b> nodes, <b>${meta.nTriangles.toLocaleString('en')}</b> triangles, ` +
  `field <b>${meta.scalarName}</b> (demonstration data, no units), payload <b>2.5 MB</b> binary (4.6 MB source .vtp)`;
</script>
</body>
</html>
