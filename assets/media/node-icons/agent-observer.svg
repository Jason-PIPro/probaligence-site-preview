<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- background circle -->
  <circle cx="10" cy="10" r="10" fill="#1a1a1a" fill-opacity="0.85"/>
  <!-- antenna -->
  <line x1="10" y1="3" x2="10" y2="5.5" stroke="#ffd54f" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="10" cy="2.5" r="1.2" fill="#ffd54f"/>
  <!-- head -->
  <rect x="4.5" y="5.5" width="11" height="8.5" rx="2.5" ry="2.5" fill="#ffd54f"/>
  <!-- eyes -->
  <circle cx="7.5" cy="9" r="1.5" fill="#1a1a1a"/>
  <circle cx="12.5" cy="9" r="1.5" fill="#1a1a1a"/>
  <!-- mouth -->
  <rect x="7" y="12" width="6" height="1.2" rx="0.6" fill="#1a1a1a"/>
  <!-- ear accents -->
  <rect x="2.5" y="7.5" width="2" height="3.5" rx="1" fill="#ffd54f"/>
  <rect x="15.5" y="7.5" width="2" height="3.5" rx="1" fill="#ffd54f"/>
</svg>
