<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tri-fold brochure, 3D model</title>
<!-- A 3D model of the tri-fold brochure to fold with the mouse (Jason, 2026-10-09). Drag a side page to fold it, drag
     anywhere else to turn the brochure. Shows the design draft in mock-trifold-2026-10-08/panels/ (from build-brochure.py
     --panels). One self-contained file: py build-fold-standalone.py writes fold-model-standalone.html. Draft, not for print. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #E4E1DA; color: #2B2B2B; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 18px 0; }
  h1 { font-size: 22px; line-height: 1.2; }
  header p { margin-top: 2px; font-size: 13px; color: #47443E; }
  .stage { position: relative; flex: 1; min-height: 340px; margin: 12px 18px 0; perspective: 2400px; display: flex; align-items: center; justify-content: center;
           background: radial-gradient(ellipse at 50% 40%, #E6E2D9, #C7C2B6); border-radius: 12px; overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
  .stage.dragging { cursor: grabbing; }
  .sheet { position: relative; --mm: 2.2px; width: calc(var(--mm)*297); height: calc(var(--mm)*210); transform-style: preserve-3d;
           transform: translateX(var(--shift, 0px)) scale(var(--zoom, 1)) rotateX(var(--rx, 14deg)) rotateY(var(--turn, 0deg)); transform-origin: calc(var(--mm)*150) calc(var(--mm)*105); }
  .panel { position: absolute; top: 0; height: calc(var(--mm)*210); transform-style: preserve-3d; }
  .pA { left: 0; width: calc(var(--mm)*100); transform-origin: right center; transform: translateZ(var(--liftA, 0px)) rotateY(var(--a, 0deg)); cursor: ew-resize; }
  .pB { left: calc(var(--mm)*100); width: calc(var(--mm)*100); }
  .pC { left: calc(var(--mm)*200); width: calc(var(--mm)*97); transform-origin: left center; transform: translateZ(var(--liftC, 0px)) rotateY(var(--c, 0deg)); cursor: ew-resize; }
  .side { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #000; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .side.back { transform: rotateY(180deg); }
  .side img { display: block; width: 100%; height: 100%; pointer-events: none; }
  .hint { margin: 10px 18px 0; font-size: 14px; color: #47443E; }
  .hint b { color: #2B2B2B; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px 18px; }
  button { font: 600 14px/1 "Segoe UI", system-ui, sans-serif; padding: 10px 16px; border-radius: 8px; border: 1.5px solid #141414; background: #FFF; color: #141414; cursor: pointer; touch-action: manipulation; }
  button:hover { background: #F4F0E6; }
  button.main { border-color: #B57A00; background: #FFB006; }
  button:focus-visible { outline: 3px solid #FFB006; outline-offset: 2px; }
  @media (max-width: 640px) { header, .hint, .bar { padding-left: 10px; padding-right: 10px; } .hint { margin-left: 10px; margin-right: 10px; } .stage { margin: 10px 10px 0; } }
</style>
</head>
<body>
<header>
  <h1>PI Probaligence tri-fold brochure: 3D model</h1>
  <p>One A4 sheet, roll-folded. A B C are the inside, D E F the outside. Draft for review, not approved for print.</p>
</header>
<div class="stage" id="stage" aria-label="3D model of the brochure. Drag a side page to fold it, drag elsewhere to turn it.">
  <div class="sheet" id="sheet">
    <div class="panel pA"><div class="side" data-f="A"></div><div class="side back" data-f="F"></div></div>
    <div class="panel pB"><div class="side" data-f="B"></div><div class="side back" data-f="E"></div></div>
    <div class="panel pC"><div class="side" data-f="C"></div><div class="side back" data-f="D"></div></div>
  </div>
</div>
<p class="hint" id="hint" aria-live="polite"><b>Drag a side page</b> to fold it. <b>Drag anywhere else</b> to turn the brochure.</p>
<div class="bar">
  <button class="main" id="fold">Fold it</button>
  <button id="unfold">Unfold</button>
  <button id="flip">Flip over</button>
  <button id="reset">Reset</button>
</div>

const ALT = {
  A: 'Page A, inside left: start with the data you have.', B: 'Page B, inside middle: every prediction comes with its uncertainty.',
  C: 'Page C, inside right: decide what comes next.', D: 'Page D, first page when the cover opens: custom design for your specific task.',

const stage = document.getElementById('stage'), sheet = document.getElementById('sheet'), hint = document.getElementById('hint');
const START = { a: 0, c: 0, rx: 14, turn: 0 };
const st = { ...START };
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let MM = 2.2, Z = 1, drag = null, raf = null, hintTimer = null;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// A folds over its right edge (0 to 180 degrees), C over its left edge (0 to -180). The lifts grow with the fold so
// the outer page A lies above C when both are closed, as in a roll fold.
function apply() {
  sheet.style.setProperty('--a', st.a.toFixed(1) + 'deg');
  sheet.style.setProperty('--c', st.c.toFixed(1) + 'deg');
  sheet.style.setProperty('--liftA', (4 * st.a / 180).toFixed(2) + 'px');
  sheet.style.setProperty('--liftC', (2 * -st.c / 180).toFixed(2) + 'px');
  sheet.style.setProperty('--rx', st.rx.toFixed(1) + 'deg');
  sheet.style.setProperty('--turn', st.turn.toFixed(1) + 'deg');
  frame();
}
// Frame what is showing: the footprint shrinks as A and C fold over B, so a folded brochure fills a phone screen.
function frame() {
  const rad = Math.PI / 180, W = stage.clientWidth - 40, H = stage.clientHeight - 60;
  const left = st.a <= 90 ? 100 * (1 - Math.cos(st.a * rad)) : 100;
  const right = st.c >= -90 ? 200 + 97 * Math.cos(st.c * rad) : 200;
  const k = Math.abs(Math.cos(st.turn * rad));   // ease the zoom back while turned sideways, so nothing sticks out
  const zoom = 1 + (Math.max(1, Math.min(W / ((right - left) * MM), H / (210 * MM))) - 1) * k * k;
  const shift = -((left + right) / 2 - 150) * MM * zoom * Math.cos(st.turn * rad);
  Z = zoom;
  sheet.style.setProperty('--zoom', zoom.toFixed(3));
  sheet.style.setProperty('--shift', shift.toFixed(1) + 'px');
}
function fit() {
  endDrag(true);                                   // a resize or rotation ends a drag cleanly
  MM = Math.max(0.5, Math.min((stage.clientWidth - 60) / 297, (stage.clientHeight - 80) / 210));
  sheet.style.setProperty('--mm', MM + 'px');
  frame();
}
function say(text) {
  clearTimeout(hintTimer);
  hint.innerHTML = text;
  hintTimer = setTimeout(() => { hint.innerHTML = HINT; }, 2600);
}
const HINT = hint.innerHTML;

// Animation runs frame by frame on the state itself, so grabbing a page mid-animation starts from what is on screen.
function stopAnim() { cancelAnimationFrame(raf); raf = null; }
function endDrag(settle) {
  if (!drag) return;
  const panel = drag.panel, id = drag.id;
  drag = null;
  stage.classList.remove('dragging');
  try { stage.releasePointerCapture(id); } catch (_) {}
  if (settle && panel === 'a') run([{ a: st.a >= 90 ? 180 : 0 }], 300);

function run(steps, ms = 750) {
  endDrag(false);                                  // a button tap ends any drag first
  stopAnim();
  let i = 0;
  const next = () => {
    if (i >= steps.length) return;
    const target = steps[i++], from = { ...st }, t0 = performance.now(), dur = reduce.matches ? 0 : ms;

// Roll fold order: C (inside) moves only while A (outside) is open, or the two pages would pass through each other.
stage.addEventListener('pointerdown', e => {
  if (drag) return;                                   // one pointer at a time
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  if (panel === 'c' && st.a > 1) { say('<b>Open page A first.</b> Page C folds inside, under A.'); panel = 'none'; }

  const dir = Math.cos(drag.from.turn * Math.PI / 180) >= 0 ? 1 : -1;   // turned over: screen directions mirror
  if (drag.panel === 'a') st.a = clamp(drag.from.a + dir * dx / (100 * MM * drag.z) * 180, 0, 180);
  else if (drag.panel === 'c') st.c = clamp(drag.from.c + dir * dx / (97 * MM * drag.z) * 180, -180, 0);
  else { st.turn = drag.from.turn + dx * 0.4; st.rx = clamp(drag.from.rx - dy * 0.3, -70, 70); }
  apply();
});
// On release a page settles fully open or fully folded, whichever is nearer, so it is never left edge-on.
function release(e) {
  if (!drag || e.pointerId !== drag.id) return;
  endDrag(true);
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('lostpointercapture', release);

document.getElementById('fold').addEventListener('click', () => run(st.a > 1 && st.c > -179 ? [{ a: 0 }, { c: -180 }, { a: 180 }] : [{ c: -180 }, { a: 180 }]));
document.getElementById('unfold').addEventListener('click', () => run([{ a: 0 }, { c: 0 }]));
document.getElementById('flip').addEventListener('click', () => run([{ turn: Math.round(st.turn / 180) * 180 + 180, rx: 14 }]));
document.getElementById('reset').addEventListener('click', () => run([{ a: 0 }, { c: 0 }, { rx: START.rx, turn: START.turn }]));
window.addEventListener('resize', fit);
fit();
apply();
</script>
</body>
</html>
